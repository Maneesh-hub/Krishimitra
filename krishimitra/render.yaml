# Optional Render Blueprint (the DEPLOY.md guide also shows the same setup by hand in the dashboard).
services:
  - type: web
    name: krishimitra-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: client_ORIGIN
        sync: false          # you are prompted for it: your Vercel URL, no trailing slash
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CEDA_API_TOKEN
        sync: false
      - key: CEDA_API_BASE_URL
        value: https://api.ceda.ashoka.edu.in/v1
